<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 Fused Depth Sensor (BLE)</title>
<style>
  body { font-family: sans-serif; background:#111; color:#eee; text-align:center; padding:16px; margin:0; }
  h1 { font-size: 1.25em; margin: 0 0 12px; }
  .value { font-size: 3em; font-weight: bold; margin: 14px 0 4px; }
  .ci { font-size: 1.05em; color:#9cf; min-height: 1.4em; }
  .detail { font-size: 0.88em; color:#aaa; margin-top: 6px; line-height: 1.7; }
  .warn { color:#f66; font-size: 0.88em; margin-top: 6px; min-height: 1.2em; }
  .row { margin: 12px 0; }
  button { font-size: 0.95em; padding: 9px 14px; margin: 4px; border-radius: 8px; border: 1px solid #555; background:#222; color:#eee; cursor:pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
  button.active { background:#2a6; border-color:#2a6; color:#fff; }
  #connectBtn { background:#36a; border-color:#36a; }
  #measureBtn { background:#36a; border-color:#36a; }
  #recalBtn { background:#654; border-color:#654; }
  hr { border:0; border-top:1px solid #333; margin:18px 0; }
  .small { font-size: 0.82em; color:#999; }
  .mono { font-family: monospace; color:#ccc; }
  #status { font-size: 0.9em; margin-top: 4px; }
  .on { color:#2a6; } .off { color:#f66; } .mid { color:#fa0; }
</style>
</head>
<body>
  <h1>ESP32 Fused Depth Sensor</h1>

  <div class="row">
    <button id="connectBtn" onclick="toggleConnection()">Connect</button>
    <div id="status" class="off">Not connected</div>
    <div class="small" id="supportMsg"></div>
  </div>

  <div class="row">
    <button id="fusedBtn" onclick="setMode(1)" disabled>Fused (Model+MPU)</button>
    <button id="rawBtn"   onclick="setMode(0)" disabled>Raw</button>
  </div>
  <div class="row">
    <button id="contBtn" onclick="setContinuous(1)" disabled>Continuous</button>
    <button id="onceBtn" onclick="setContinuous(0)" disabled>Once</button>
    <button id="measureBtn" onclick="measureNow()" disabled>Measure Now</button>
  </div>

  <div class="value" id="valueOut">--</div>
  <div class="ci"     id="ciOut"></div>
  <div class="detail" id="detailOut"></div>
  <div class="warn"   id="warnOut"></div>

  <hr>
  <div class="small">
    <b>Auto-Axis Calibration</b>
    <div class="mono" id="axisLive" style="margin-top:8px; font-size:1.1em;"></div>
  </div>

  <hr>
  <div class="row">
    <button id="recalBtn" onclick="recalibrate()" disabled>Recalibrate MPU (keep still!)</button>
  </div>
  <div class="small" id="mpuState"></div>
  <!-- NEW: MPU die temperature readout -->
  <div class="small" id="mpuTempState" style="margin-top:4px;"></div>

  <div id="otaBox" style="display:none">
    <hr>
    <div class="small"><b>Firmware update (over Bluetooth)</b></div>
    <div class="row">
      <input type="file" id="fwFile" accept=".bin">
      <button id="otaBtn" onclick="uploadFirmware()" disabled>Upload firmware</button>
    </div>
    <progress id="otaBar" value="0" max="100" style="width:80%"></progress>
    <div class="small" id="otaMsg">Use the <span class="mono">.ino.bin</span> file from Sketch &rarr; Export Compiled Binary. Keep this page open and the phone near the board.</div>
  </div>

<script>
// ---------------------------------------------------------------------------
// BLE (Nordic UART Service) - must match the ESP32 firmware
// ---------------------------------------------------------------------------
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
const OTA_CTRL = '6e400004-b5a3-f393-e0a9-e50e24dcca9e';
const OTA_DATA = '6e400005-b5a3-f393-e0a9-e50e24dcca9e';

let device = null, rxChar = null, txChar = null, otaCtrl = null, otaData = null, otaRunning = false;
let buf = '';
let connected = false;
let lastState = null;

const $ = id => document.getElementById(id);

function setStatus(text, cls) {
  const s = $('status');
  s.textContent = text;
  s.className = cls;
}

function setControlsEnabled(on) {
  ['fusedBtn', 'rawBtn', 'contBtn', 'onceBtn', 'recalBtn'].forEach(id => $(id).disabled = !on);
  $('measureBtn').disabled = !on || (lastState && lastState.continuous);
}

if (!('bluetooth' in navigator)) {
  $('connectBtn').disabled = true;
  $('supportMsg').textContent =
    'Web Bluetooth is not supported in this browser. Use Chrome on Android or desktop (on iPhone, try the Bluefy app).';
}

async function toggleConnection() {
  if (connected && device && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }
  await connectBLE();
}

async function connectBLE() {
  try {
    setStatus('Choose a device...', 'mid');
    device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    device.addEventListener('gattserverdisconnected', onDisconnected);

    setStatus('Connecting...', 'mid');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SVC);
    rxChar = await service.getCharacteristic(RX);
    txChar = await service.getCharacteristic(TX);

    buf = '';
    txChar.addEventListener('characteristicvaluechanged', onNotify);
    await txChar.startNotifications();

    try {
      otaCtrl = await service.getCharacteristic(OTA_CTRL);
      otaData = await service.getCharacteristic(OTA_DATA);
      otaCtrl.addEventListener('characteristicvaluechanged', onOtaMsg);
      await otaCtrl.startNotifications();
      $('otaBox').style.display = 'block';
      $('otaBtn').disabled = false;
    } catch (_) {
      otaCtrl = otaData = null;
      $('otaBox').style.display = 'none';
    }

    connected = true;
    $('connectBtn').textContent = 'Disconnect';
    setStatus('Connected to ' + (device.name || 'ESP32'), 'on');
    setControlsEnabled(true);

    await send('measure');
  } catch (e) {
    console.error(e);
    connected = false;
    setStatus(e && e.name === 'NotFoundError' ? 'No device selected' : 'Connection failed: ' + (e.message || e), 'off');
    $('connectBtn').textContent = 'Connect';
    setControlsEnabled(false);
  }
}

function onDisconnected() {
  connected = false;
  rxChar = txChar = otaCtrl = otaData = null;
  $('otaBtn').disabled = true;
  $('connectBtn').textContent = 'Connect';
  setStatus('Disconnected', 'off');
  setControlsEnabled(false);
}

function onNotify(e) {
  buf += new TextDecoder().decode(e.target.value);
  let i;
  while ((i = buf.indexOf('\n')) >= 0) {
    const line = buf.slice(0, i).trim();
    buf = buf.slice(i + 1);
    if (!line) continue;
    try { render(normalize(JSON.parse(line))); } catch (err) { console.warn('Bad packet', line); }
  }
}

async function send(cmd) {
  if (!rxChar) return;
  try {
    await rxChar.writeValue(new TextEncoder().encode(cmd));
  } catch (e) {
    console.error('Write failed', e);
  }
}

// Map the short keys sent by the ESP32 to the names render() uses
function normalize(p) {
  return {
    showFused:  !!p.f,
    continuous: !!p.c,
    axisName:   p.ax,
    axisLocked: !!p.lk,
    mpuReady:   !!p.mr,
    valid:      !!p.v,
    missed:     !!p.ms,
    raw:        p.raw,
    model:      p.mod,
    lo:         p.lo,
    hi:         p.hi,
    fused:      p.fu,
    mpuPred:    (p.mp === undefined ? null : p.mp),
    mpuUsed:    p.mu,
    source:     p.src,
    outOfRange: !!p.oor,
    mpuTemp:    (p.tp === undefined ? null : p.tp)   // NEW
  };
}

// ---------------------------------------------------------------------------
// Commands
// ---------------------------------------------------------------------------
function setMode(f)       { send('mode:' + (f ? 1 : 0)); }
function setContinuous(c) { send('cont:' + (c ? 1 : 0)); }
let measureBusy = false;
function measureNow() {
  if (measureBusy) return;
  measureBusy = true;
  send('measure');
  setTimeout(() => { measureBusy = false; }, 500);
}
async function recalibrate() {
  const b = $('recalBtn');
  b.disabled = true; b.textContent = 'Calibrating...';
  await send('recal');
  setTimeout(() => {
    b.textContent = 'Recalibrate MPU (keep still!)';
    b.disabled = !connected;
  }, 2500);
}

// ---------------------------------------------------------------------------
// Firmware update over BLE
// ---------------------------------------------------------------------------
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

const otaListeners = [];
function onOtaMsg(e) {
  const m = new TextDecoder().decode(e.target.value);
  otaListeners.slice().forEach(f => f(m));
}
function otaWait(pred, ms) {
  return new Promise((resolve, reject) => {
    let timer;
    const f = m => {
      if (m.startsWith('err:')) { done(); reject(new Error('Device error: ' + m.slice(4))); }
      else if (pred(m)) { done(); resolve(m); }
    };
    const done = () => {
      clearTimeout(timer);
      const i = otaListeners.indexOf(f);
      if (i >= 0) otaListeners.splice(i, 1);
    };
    timer = setTimeout(() => { done(); reject(new Error('Timed out waiting for the device')); }, ms);
    otaListeners.push(f);
  });
}
const enc = s => new TextEncoder().encode(s);
function setOta(msg) { $('otaMsg').textContent = msg; }

async function uploadFirmware() {
  if (otaRunning || !otaCtrl || !otaData) return;
  const file = $('fwFile').files[0];
  if (!file) { setOta('Choose a .bin file first.'); return; }
  if (/bootloader|partitions|merged/i.test(file.name)) {
    setOta('Wrong file. Use the plain .ino.bin app file, not bootloader, partitions or merged.');
    return;
  }
  const pwd = prompt('Firmware update password:');
  if (!pwd) return;

  const data = new Uint8Array(await file.arrayBuffer());
  if (data[0] !== 0xE9) { setOta('This does not look like an ESP32 firmware image.'); return; }
  if (!confirm('Upload ' + file.name + ' (' + data.length + ' bytes)? Do not disconnect or close this page until it finishes.')) return;

  otaRunning = true;
  $('otaBtn').disabled = true;
  $('otaBar').value = 0;
  const CHUNK = 240, WINDOW = 4096;
  const t0 = Date.now();

  try {
    const crc = crc32(data);

    setOta('Preparing the device (erasing flash, this can take 10-20 seconds)...');
    const ready = otaWait(m => m === 'ready', 60000);
    ready.catch(() => {});
    await otaCtrl.writeValue(enc('begin:' + data.length + ':' + pwd));
    await ready;

    let offset = 0;
    while (offset < data.length) {
      const winEnd = Math.min(offset + WINDOW, data.length);
      const ack = otaWait(m => m.startsWith('ack:') && Number(m.slice(4)) >= winEnd, 15000);
      ack.catch(() => {});
      while (offset < winEnd) {
        const n = Math.min(CHUNK, winEnd - offset);
        await otaData.writeValueWithoutResponse(data.subarray(offset, offset + n));
        offset += n;
      }
      await ack;
      $('otaBar').value = Math.round(offset * 100 / data.length);
      const secs = (Date.now() - t0) / 1000;
      setOta('Uploading... ' + $('otaBar').value + '% (' + (offset / 1024 / Math.max(secs, 0.1)).toFixed(1) + ' KB/s)');
    }

    setOta('Verifying and installing...');
    const fin = otaWait(m => m === 'done', 20000);
    fin.catch(() => {});
    await otaCtrl.writeValue(enc('end:' + crc));
    await fin;
    setOta('Update installed. The board is rebooting. Wait a few seconds, then tap Connect again.');
  } catch (e) {
    console.error(e);
    setOta('Update failed: ' + (e.message || e) + '. The old firmware is still in place.');
    try { await otaCtrl.writeValue(enc('abort')); } catch (_) {}
  } finally {
    otaRunning = false;
    $('otaBtn').disabled = !connected || !otaCtrl;
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function render(d) {
  lastState = d;

  $('fusedBtn').classList.toggle('active', d.showFused);
  $('rawBtn').classList.toggle('active', !d.showFused);
  $('contBtn').classList.toggle('active', d.continuous);
  $('onceBtn').classList.toggle('active', !d.continuous);
  $('measureBtn').disabled = !connected || d.continuous;

  const aOut = $('axisLive');
  if (d.axisLocked) {
    aOut.innerHTML = 'Beam Axis: <span style="color:#2a6">' + d.axisName + ' (Locked)</span>';
  } else {
    aOut.innerHTML = 'Beam Axis: <span style="color:#fa0">' + d.axisName + ' (Learning... Move the board)</span>';
  }

  $('mpuState').textContent = d.mpuReady ? 'MPU OK' : 'MPU6050 NOT detected';
  // NEW: MPU die temperature
  $('mpuTempState').textContent = (d.mpuReady && d.mpuTemp !== null && d.mpuTemp !== undefined)
    ? 'MPU temperature: ' + Number(d.mpuTemp).toFixed(1) + ' °C'
    : '';

  const vOut = $('valueOut');
  const cOut = $('ciOut');
  const dOut = $('detailOut');
  const wOut = $('warnOut');

  if (!d.valid) {
    vOut.textContent = '--';
    cOut.textContent = '';
    dOut.textContent = '';
    wOut.textContent = 'Waiting for an echo from the HC-SR04...';
    return;
  }

  if (d.showFused) {
    vOut.textContent = d.fused.toFixed(2) + ' cm';
    cOut.textContent = 'Model 95% CI: [' + d.lo.toFixed(2) + ', ' + d.hi.toFixed(2) + '] cm';

    let html = 'Source: <b>' + d.source + '</b><br>';
    html += 'Model estimate: ' + d.model.toFixed(2) + ' cm<br>';
    if (d.mpuPred === null)
      html += 'MPU prediction: &mdash;<br>';
    else
      html += 'MPU prediction: ' + d.mpuPred.toFixed(2) + ' cm (&#916; ' + (d.mpuUsed >= 0 ? '+' : '') + d.mpuUsed.toFixed(2) + ' cm)<br>';
    html += 'Raw echo: ' + d.raw.toFixed(2) + ' cm';
    dOut.innerHTML = html;
  } else {
    vOut.textContent = d.raw.toFixed(2) + ' cm';
    cOut.textContent = '';
    dOut.textContent = '';
  }

  let warn = '';
  if (d.outOfRange) warn += 'Warning: outside training range. ';
  if (d.missed) warn += 'Last echo timed out.';
  wOut.textContent = warn;
}
</script>
</body>
</html>
